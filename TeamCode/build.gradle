// Sloth Load plugin (fast deploys). See https://github.com/Dairy-Foundation/Sloth
// Keep this version in sync with the Sloth, Slothboard and Panels versions below.
buildscript {
    repositories {
        mavenCentral()
        google()
        maven {
            url "https://repo.dairy.foundation/releases"
        }
    }
    dependencies {
        classpath "dev.frozenmilk:Load:0.3.2"
    }
}

apply plugin: 'com.android.application'
apply plugin: 'dev.frozenmilk.sinister.sloth.load'

//
// build.gradle in TeamCode
//
// Most of the definitions for building your module reside in a common, shared
// file 'build.common.gradle'. Being factored in this way makes it easier to
// integrate updates to the FTC into your code. If you really need to customize
// the build definitions, you can place those customizations in this file, but
// please think carefully as to whether such customizations are really necessary
// before doing so.

// Custom definitions may go here

// Include common definitions from above.
apply from: '../build.common.gradle'
apply from: '../build.dependencies.gradle'

android {
    namespace = 'org.firstinspires.ftc.teamcode'

    packagingOptions {
        jniLibs.useLegacyPackaging true
    }
}

repositories {
    maven {
        url = 'https://mymaven.bylazar.com/releases'
    }

    maven {
        url = "https://repo.dairy.foundation/releases"
    }

    maven {
        url = "https://repo.dairy.foundation/snapshots"
    }
}

dependencies {
    implementation project(':FtcRobotController')
    annotationProcessor files('lib/OpModeAnnotationProcessor.jar')

    // SolversLib: Latest Stable Version

    implementation "org.solverslib:core:0.3.6" // core
    implementation "org.solverslib:pedroPathing:0.3.6" // pedroPathing
    implementation "org.solverslib:photon:0.3.6" // photon is optional (see docs for more info)

    // Sloth: hot reload of TeamCode. Deploy with the `deploySloth` Gradle task (see TeamCode readme).
    implementation "dev.frozenmilk.sinister:Sloth:0.3.2"

    // FTC Dashboard, Sloth fork (the normal com.acmerobotics.dashboard build breaks Sloth hot reload)
    implementation "com.acmerobotics.slothboard:dashboard:0.3.2+0.6.0"

    // Pedro Pathing
    implementation 'com.pedropathing:revhub:3.0.0'
    implementation 'com.pedropathing:tuning:1.0.0' // AutoTune (see Tuning.java)

    // Panels Dashboard, Sloth fork (the normal com.bylazar build breaks Sloth hot reload)
    implementation "com.bylazar.sloth:fullpanels:0.3.2+1.0.13"
}
